<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <form [formGroup]="loginForm"  class="bg-white p-8 rounded shadow-md w-full max-w-sm">
        <h2 class="text-2xl font-bold mb-6 text-center">Đăng nhập</h2>

        <!-- Email -->
        <div class="mb-4">
            <label class="block mb-1 font-semibold">Email</label>
            <input type="email" formControlName="email" placeholder="Nhập email"
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" />
            <div *ngIf="submitted && f['email'].errors" class="text-red-500 text-sm mt-1">
                <div *ngIf="f['email'].errors['required']">Email là bắt buộc.</div>
                <div *ngIf="f['email'].errors['email']">Email không hợp lệ.</div>
            </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
            <label class="block mb-1 font-semibold">Mật khẩu</label>
            <input type="password" formControlName="password" placeholder="Nhập mật khẩu"
                class="w-full px-3 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300" />
            <div *ngIf="submitted && f['password'].errors" class="text-red-500 text-sm mt-1">
                <div *ngIf="f['password'].errors['required']">Mật khẩu là bắt buộc.</div>
                <div *ngIf="f['password'].errors['minlength']">
                    Mật khẩu phải có ít nhất 6 ký tự.
                </div>
            </div>
        </div>

        <!-- Submit button -->
        <button (click)="handleLogin()" type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">
            Đăng nhập
        </button>
    </form>
</div>
