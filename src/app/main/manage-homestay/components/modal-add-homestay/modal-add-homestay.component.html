<!-- homestay-room-form.component.html -->
<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow-md h-[600px] overflow-scroll">
    <!-- Header -->
    <div class="">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Thêm phòng homestay</h1>
    </div>

    <!-- Form -->
    <form [formGroup]="roomForm" (ngSubmit)="onSubmit()" class="space-y-8">
        <!-- Thông tin phòng -->
        <div class="border border-gray-200 rounded-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Thông tin phòng</h2>
            <p class="text-gray-600 mb-6">Các trường có dấu (*) là bắt buộc</p>

            <!-- Tên phòng -->
            <div class="mb-6">
                <label for="roomName" class="block text-sm font-medium text-gray-700 mb-1">
                    Tên phòng *
                </label>
                <input type="text" id="roomName" formControlName="roomName"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Ví dụ: Phòng Deluxe Hướng Biển">
                <div *ngIf="roomForm.get('roomName')?.invalid && roomForm.get('roomName')?.touched"
                    class="mt-1 text-sm text-red-600">
                    <div *ngIf="roomForm.get('roomName')?.errors?.['required']">Tên phòng là bắt buộc</div>
                </div>
            </div>

            <!-- Loại phòng và Giá -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="roomType" class="block text-sm font-medium text-gray-700 mb-1">
                        Loại phòng *
                    </label>
                    <select id="roomType" formControlName="roomType"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="" disabled selected>Chọn loại phòng</option>
                        <option value="standard">Standard</option>
                        <option value="deluxe">Deluxe</option>
                        <option value="suite">Suite</option>
                    </select>
                    <div *ngIf="roomForm.get('roomType')?.invalid && roomForm.get('roomType')?.touched"
                        class="mt-1 text-sm text-red-600">
                        <div *ngIf="roomForm.get('roomType')?.errors?.['required']">Loại phòng là bắt buộc</div>
                    </div>
                </div>

                <div>
                    <label for="price" class="block text-sm font-medium text-gray-700 mb-1">
                        Giá/đêm (VNĐ) *
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500">₫</span>
                        </div>
                        <input type="number" id="price" formControlName="price"
                            class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="500000">
                    </div>
                    <div *ngIf="roomForm.get('price')?.invalid && roomForm.get('price')?.touched"
                        class="mt-1 text-sm text-red-600">
                        <div *ngIf="roomForm.get('price')?.errors?.['required']">Giá phòng là bắt buộc</div>
                        <div *ngIf="roomForm.get('price')?.errors?.['min']">Giá phòng phải lớn hơn 0</div>
                    </div>
                </div>
            </div>

            <!-- Diện tích -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Diện tích (m²)
                </label>
                <div class="flex items-center space-x-4">
                    <input type="text" id="roomAcreage" formControlName="roomAcreage"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        placeholder="Diện tích phòng">
                </div>
            </div>

            <!-- Mô tả phòng -->
            <div class="mb-4">
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">
                    Mô tả phòng
                </label>
                <textarea id="description" formControlName="description" rows="4"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Mô tả chi tiết về phòng, view, đặc điểm nổi bật..."></textarea>
            </div>
        </div>

        <!-- Tiện nghi -->
        <div class="border border-gray-200 rounded-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Tiện nghi</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div *ngFor="let amenity of amenities" class="flex items-center">
                    <input type="checkbox" [id]="amenity.id" [value]="amenity.id" (change)="onAmenityChange($event)"
                        class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
                        [checked]="selectedAmenities.includes(amenity.id)">
                    <label [for]="amenity.id" class="ml-2 block text-sm text-gray-700">
                        {{amenity.name}}
                    </label>
                </div>
            </div>
        </div>

        <!-- Hình ảnh phòng -->
        <div class="border border-gray-200 rounded-lg p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Hình ảnh phòng</h2>
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center">
                <input type="file" id="roomImages" (change)="onFileSelected($event)" multiple accept="image/*"
                    class="hidden">
                <label for="roomImages" class="cursor-pointer">
                    <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48"
                        aria-hidden="true">
                        <path
                            d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span class="mt-2 block text-sm font-medium text-gray-900">Choose Files</span>
                    <span class="mt-1 block text-sm text-gray-500">No file chosen</span>
                </label>
            </div>

            <!-- Preview Images -->
            <div *ngIf="previewImages.length > 0" class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-4">
                <div *ngFor="let image of previewImages; let i = index" class="relative">
                    <img [src]="image.url" alt="Preview" class="w-full h-32 object-cover rounded-lg">
                    <button type="button" (click)="removeImage(i)"
                        class="absolute top-1 right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">
                        ×
                    </button>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-end space-x-4 pt-4 gap-2">
            <button type="button" (click)="clearForm()"
                class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 cursor-pointer">
                Xóa form
            </button>
            <button type="submit" [disabled]="roomForm.invalid"
                class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:bg-blue-300 cursor-pointer">
                Thêm phòng
            </button>
        </div>
    </form>
    <div *ngIf="loading">
        <app-overlay-loading></app-overlay-loading>
    </div>
</div>
