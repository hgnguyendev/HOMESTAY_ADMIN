<div class="p-6 bg-gray-50 min-h-screen">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8">
            <div class="mb-4 sm:mb-0">
                <h1 class="text-2xl font-bold text-gray-800">Quản lý homestay</h1>
                <p class="text-gray-600 mt-1">Quản lý tất cả các phòng homestay của bạn</p>
            </div>
            <button (click)="handleOpenModalAddHomestay()"
                class="bg-purple-600 text-white! rounded-lg px-5 py-3 hover:bg-purple-700 transition-all duration-300 cursor-pointer shadow-md hover:shadow-lg flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"
                        clip-rule="evenodd" />
                </svg>
                Thêm phòng mới
            </button>
        </div>

        <!-- SEARCH BAR -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

                <!-- Tên phòng -->
                <div>
                    <label class="text-sm font-medium text-gray-600">Tên phòng</label>
                    <input [(ngModel)]="search.roomName" (input)="handleClientSearch()" type="text"
                        class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500"
                        placeholder="Nhập tên phòng..." />
                </div>

                <!-- Giá min -->
                <div>
                    <label class="text-sm font-medium text-gray-600">Giá tối thiểu</label>
                    <input [(ngModel)]="search.minPrice" (input)="handleClientSearch()" type="number"
                        class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500"
                        placeholder="Từ..." />
                </div>

                <!-- Giá max -->
                <div>
                    <label class="text-sm font-medium text-gray-600">Giá tối đa</label>
                    <input [(ngModel)]="search.maxPrice" (input)="handleClientSearch()" type="number"
                        class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500"
                        placeholder="Đến..." />
                </div>

                <!-- Địa chỉ -->
                <div>
                    <label class="text-sm font-medium text-gray-600">Địa chỉ</label>
                    <input [(ngModel)]="search.address" (input)="handleClientSearch()" type="text"
                        class="mt-1 w-full px-3 py-2 border rounded-lg focus:ring-purple-500 focus:border-purple-500"
                        placeholder="Nhập địa chỉ..." />
                </div>
            </div>
        </div>


        <!-- Table Container -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
            <div class="overflow-x-auto">
                <table class="min-w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                STT</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Hình ảnh</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Tên phòng</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Giá phòng</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Diện tích</th>
                            <th class="px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Hành động</th>
                        </tr>
                    </thead>

                    <tbody class="divide-y divide-gray-200">
                        <tr *ngFor="let item of homestays; let i = index"
                            class="hover:bg-gray-50 transition-colors duration-150">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ i + 1 }}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="flex items-center">
                                    <div class="h-12 w-12 flex-shrink-0 rounded-lg overflow-hidden bg-gray-200">
                                        <img [src]="item.images[0]" alt="Avatar" class="h-full w-full object-cover" />
                                    </div>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div class="text-sm font-medium text-gray-900">{{ item.roomName }}</div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-medium">
                                {{ item.price | number }} ₫
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                {{ item.roomAcreage }} m²
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-xl font-medium">
                                <div class="flex items-center gap-2">
                                    <button class="cursor-pointer" (click)="handleDetailHomestay(item)"><i
                                            class="bi bi-eye text-blue-500"></i></button>
                                    <button class="cursor-pointer" (click)="handleEditHomestay(item)"><i
                                            class="bi bi-pencil-square text-yellow-500"></i></button>
                                    <button class="cursor-pointer" (click)="handleDeleteHomestay(item._id)"><i
                                            class="bi bi-trash text-red-500"></i></button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div *ngIf="homestays.length === 0" class="text-center py-12">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-400" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <h3 class="mt-4 text-lg font-medium text-gray-900">Chưa có phòng nào</h3>
                <p class="mt-1 text-gray-500">Bắt đầu bằng cách thêm phòng homestay đầu tiên của bạn.</p>
                <button (click)="handleOpenModalAddHomestay()"
                    class="mt-4 inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white! bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 cursor-pointer">
                    Thêm phòng đầu tiên
                </button>
            </div>
        </div>
    </div>
</div>

<div class="fixed inset-0 bg-black/40 flex justify-end z-50 backdrop-blur-sm" *ngIf="detail">
    <div class="bg-white w-[1200px] h-full shadow-2xl animate-slideInSlow" (click)="$event.stopPropagation()">
        <app-details-homestay [dataDetails]="detail"
            (emitCloseDetails)="handleCloseDetails($event)"></app-details-homestay>
    </div>
</div>
