<div class="p-4 overflow-y-auto max-h-screen">
    <!-- Header -->
    <div class="border-b border-gray-300 py-2 mb-4 flex items-center">
        <button
            class="flex items-center gap-2 text-gray-700 hover:text-purple-600 transition-all duration-300 group cursor-pointer"
            (click)="handleCloseDetails()">
            <i
                class="bi bi-arrow-left text-lg transform transition-transform duration-300 group-hover:-translate-x-1"></i>
            <span class="font-medium">Quay lại</span>
        </button>
    </div>

    <!-- Grid content -->
    <div class="p-2 grid grid-cols-12 gap-4">
        <div class="col-span-12">

            <div class="p-4">
                <div class="h-[300px] bg-center bg-cover rounded-xl shadow-md transition-all duration-500"
                    [ngStyle]="{'background-image': 'url(' + selectedImage + ')'}">
                </div>
                <div class="flex overflow-x-auto mt-4 gap-3 pb-2">
                    <div *ngFor="let img of dataDetails.images" (click)="selectedImage = img"
                        class="flex-shrink-0 w-[250px] h-[140px] rounded-lg cursor-pointer border-2 transition-all duration-300 hover:scale-105"
                        [ngStyle]="{
        'background-image': 'url(' + img + ')',
        'background-size': 'cover',
        'background-position': 'center',
        'border-color': selectedImage === img ? '#6d4ec1' : 'transparent'
      }">
                    </div>
                </div>
            </div>

            <div>
                <h1 class="text-3xl font-medium">{{dataDetails.roomName}}</h1>
                <div class="w-[300px] flex items-center justify-between mt-2">
                    <div class="flex items-center gap-1">
                        <i class="bi bi-star-fill text-yellow-400"></i>
                        <p class="mb-0" style="margin-bottom: 0;">{{dataDetails.rating}}</p>
                    </div>

                    <div class="flex items-center gap-1">
                        <i class="bi bi-geo-alt"></i>
                        <p style="margin-bottom: 0;">{{dataDetails.address}}</p>
                    </div>
                </div>
                <div class="mt-2 flex items-center gap-2">
                    <p class="bg-[#ececec] inline-block text-[12px] rounded-full px-2 py-1">Tối đa 4 khách</p>
                    <p class="bg-[#ececec] inline-block text-[12px] rounded-full px-2 py-1">2 phòng ngủ</p>
                    <p class="bg-[#ececec] inline-block text-[12px] rounded-full px-2 py-1">1 phòng tắm</p>
                </div>
            </div>

            <div class="bg-gray-100 rounded-full p-1 flex items-center  gap-2 w-fit mt-3">
                <div *ngFor="let item of menuTab" (click)="activeTab = item.type"
                    class="px-6 py-2 rounded-full cursor-pointer text-sm font-medium transition-all duration-300 select-none"
                    [ngClass]="{
      'bg-white text-black shadow-sm': activeTab === item.type,
      'text-gray-700 hover:bg-white/50': activeTab !== item.type
    }">
                    {{ item.name }}
                </div>
            </div>

            <div>
                <!-- <app-overview *ngIf="activeTab === 'overview'" [description]="dataDetails.description"></app-overview>
                <app-tien-nghi *ngIf="activeTab === 'facilities'" [amenities]="dataDetails.amenities"></app-tien-nghi>
                <app-comments *ngIf="activeTab === 'comment'" [dataHomestay]="dataDetails"></app-comments>
                <app-emty-room *ngIf="activeTab === 'emty_room'" [bookedList]="bookedList">
                </app-emty-room> -->
                <app-overview *ngIf="activeTab === 'overview'" [description]="dataDetails.description"></app-overview>
                <app-tien-nghi *ngIf="activeTab === 'facilities'" [amenities]="dataDetails.amenities"></app-tien-nghi>
                <app-comments *ngIf="activeTab === 'comment'" [dataHomestay]="dataDetails"></app-comments>
                <app-emty-room *ngIf="activeTab === 'emty_room'" [bookedList]="bookedList"></app-emty-room>
            </div>
        </div>

    </div>
</div>
